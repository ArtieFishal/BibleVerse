name: Deploy site to IPFS

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "site/**"
      - ".github/workflows/deploy-ipfs.yml"
  workflow_dispatch:

jobs:
  build-and-pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload site/ to Pinata (main page + embedded theater)
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          if [ -z "$PINATA_JWT" ]; then
            echo "::error::PINATA_JWT secret is not set."
            exit 1
          fi
          args=()
          while IFS= read -r -d '' f; do
            args+=(-F "file=@${f};filename=${f}")
          done < <(find site -type f -print0)
          echo "Uploading site/ (${#args[@]} files, includes theater/)..."

          response=$(curl -s --fail-with-body -X POST \
            "https://api.pinata.cloud/pinning/pinFileToIPFS" \
            -H "Authorization: Bearer ${PINATA_JWT}" \
            -F 'pinataMetadata={"name":"bibleverse-site"}' \
            -F 'pinataOptions={"cidVersion":1}' \
            "${args[@]}")

          echo "$response"
          cid=$(echo "$response" | jq -r '.IpfsHash')
          if [ -z "$cid" ] || [ "$cid" = "null" ]; then
            echo "::error::site upload failed: $response"
            exit 1
          fi

          {
            echo "## Main site pinned to IPFS"
            echo ""
            echo "**CID:** \`$cid\`"
            echo ""
            echo "Preview: https://ipfs.io/ipfs/$cid/ | https://gateway.pinata.cloud/ipfs/$cid/"
            echo ""
            echo "### To restore the main bibleverse.eth page"
            echo "1. Open https://app.ens.domains/bibleverse.eth?tab=records"
            echo "2. Edit **Content Hash** to: \`ipfs://$cid\`"
            echo "3. Confirm the transaction with the wallet that owns the name."
            echo ""
            echo "### Film Theater is embedded at ./theater/ inside this CID"
            echo "The button on the main page links to theater/ (relative), so it works on any gateway that serves this CID — no subdomain, no external links."
          } >> "$GITHUB_STEP_SUMMARY"
