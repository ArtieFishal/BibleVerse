name: Deploy site to IPFS

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/deploy-ipfs.yml"
  workflow_dispatch:

jobs:
  build-and-pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload dist/ to Pinata
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          if [ -z "$PINATA_JWT" ]; then
            echo "::error::PINATA_JWT secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Pinata directory upload: each file path must be rooted at "dist/"
          args=()
          while IFS= read -r -d '' f; do
            args+=(-F "file=@${f};filename=${f}")
          done < <(find dist -type f -print0)
          echo "Uploading ${#args[@]} files..."

          response=$(curl -s --fail-with-body -X POST \
            "https://api.pinata.cloud/pinning/pinFileToIPFS" \
            -H "Authorization: Bearer ${PINATA_JWT}" \
            -F 'pinataMetadata={"name":"bibleverse-vr"}' \
            -F 'pinataOptions={"cidVersion":1}' \
            "${args[@]}")

          echo "$response"
          cid=$(echo "$response" | jq -r '.IpfsHash')
          if [ -z "$cid" ] || [ "$cid" = "null" ]; then
            echo "::error::Upload failed: $response"
            exit 1
          fi

          {
            echo "## Pinned to IPFS"
            echo ""
            echo "**CID:** \`$cid\`"
            echo ""
            echo "Preview: https://ipfs.io/ipfs/$cid/ | https://gateway.pinata.cloud/ipfs/$cid/"
            echo ""
            echo "### To publish on vr.bibleverse.eth"
            echo "1. Open https://app.ens.domains/vr.bibleverse.eth?tab=records"
            echo "2. Edit **Content Hash** to: \`ipfs://$cid\`"
            echo "3. Confirm the transaction with the wallet that owns bibleverse.eth."
            echo "4. Point the main site ENTER HERE link to https://vr.bibleverse.eth.limo"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "CID: $cid"
